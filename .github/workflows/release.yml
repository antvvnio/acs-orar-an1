name: Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ACS-Orar-v1.9.8-debug.apk

      - name: Publish v1.9.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.9.8 >/dev/null 2>&1; then
            gh release upload v1.9.8 ACS-Orar-v1.9.8-debug.apk --clobber
          else
            gh release create v1.9.8 \
              ACS-Orar-v1.9.8-debug.apk \
              --title "ACS Orar v1.9.8" \
              --notes "Android timetable app for first-year ACS / UPB. v1.9.8 keeps electives such as AB IA1 in the subgroup section, exposes all subgroup choices for the group, and avoids hiding optional courses when their cell is drawn in only one subgroup column."
          fi
