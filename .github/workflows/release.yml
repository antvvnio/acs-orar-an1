name: Publish Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        if: steps.release.outputs.exists != 'true'
        run: gradle :app:assembleDebug

      - name: Prepare release APK
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "ACS-Orar-v$VERSION-debug.apk"

      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "ACS-Orar-v$VERSION-debug.apk" \
            --title "ACS Orar v$VERSION" \
            --notes "Android timetable app for first-year ACS / UPB."
